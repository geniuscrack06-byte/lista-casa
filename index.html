<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llista de la Casa</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .summary {
      color: #666;
    }

    .add-box {
      background: white;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 2px 10px #00000012;
      margin-bottom: 20px;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .product {
      background: white;
      margin: 10px 0;
      padding: 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px #0000000d;
    }

    .product input[type="checkbox"] {
      width: 25px;
      height: 25px;
      margin: 0;
    }

    .info {
      flex: 1;
    }

    .name {
      font-size: 17px;
      font-weight: bold;
    }

    .quantity {
      color: #666;
      margin-top: 3px;
    }

    .category {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
    }

    .delete {
      width: auto;
      padding: 8px 10px;
      background: #eee;
      color: #333;
      margin: 0;
    }

    .bought {
      opacity: 0.55;
    }

    .bought .name {
      text-decoration: line-through;
    }

    .section-title {
      margin-top: 25px;
      font-size: 18px;
    }

    .clear {
      background: #ddd;
      color: #222;
      margin-top: 15px;
    }

    #search {
      margin-bottom: 15px;
    }
     .confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #00000066;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .confirm-window {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 25px #00000033;
    }

    .confirm-window h2 {
      margin-top: 0;
    }

    .confirm-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .confirm-buttons button {
      margin-top: 0;
    }

    .confirm-cancel {
      background: #eee;
      color: #222;
    }

    .confirm-accept {
      background: #d33;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>🛒 Llista de la Casa</h1>
    <div class="summary" id="summary">Cargando...</div>
  </header>

  <div class="add-box">
    <input id="name" placeholder="Producto (ej. Leche)">
    <input id="quantity" placeholder="Cantidad (ej. 2 litros)">

    <select id="category">
      <option value="">Sin categoría</option>
      <option>🥦 Fruta y verdura</option>
      <option>🥩 Carne y pescado</option>
      <option>🥛 Lácteos</option>
      <option>🥖 Panadería</option>
      <option>🥫 Alimentación</option>
      <option>🧹 Limpieza</option>
      <option>🧴 Higiene</option>
      <option>🐶 Mascotas</option>
      <option>📦 Otros</option>
    </select>

    <input id="note" placeholder="Nota (opcional)">

    <button onclick="addProduct()">➕ Añadir producto</button>
  </div>
    <button onclick="escucharVoz()">🎙️ Añadir por voz</button>
    <p id="resultadoVoz"></p>
  <input id="search" placeholder="🔎 Buscar producto..." oninput="renderProducts()">

  <div class="section-title">🛒 Por comprar</div>
  <div id="pending"></div>

  <div class="section-title">✅ Comprado</div>
  <div id="bought"></div>

  <button class="clear" onclick="deleteBought()">
    🗑️ Borrar productos comprados
  </button>

</div>
<!-- Ventana de confirmación -->
<div id="confirmBox" class="confirm-overlay">
  <div class="confirm-window">
    <h2 id="confirmTitle">🗑️ Confirmar</h2>
    <p id="confirmMessage">¿Estás seguro?</p>

    <div class="confirm-buttons">
      <button id="confirmCancel" class="confirm-cancel">
        Cancelar
      </button>

      <button id="confirmAccept" class="confirm-accept">
        Eliminar
      </button>
    </div>
  </div>
</div>
  
<script>
  const SUPABASE_URL = "https://szqagikpxrgcfibcifkw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_YYuqrJJwhv7KnmBvXmonPg_dh3UZflh";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let products = [];

  async function loadProducts() {
    const { data, error } = await supabaseClient
      .from("productos")
      .select("*")
      .order("creado_en", { ascending: true });

    if (error) {
      console.error(error);
      document.getElementById("summary").textContent =
        "Error al cargar la lista";
      return;
    }

    products = data;
    renderProducts();
  }

  function escucharVoz() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Tu navegador no admite reconocimiento de voz.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "es-ES";
  recognition.start();

  recognition.onresult = (event) => {
    const texto = event.results[0][0].transcript;

    document.getElementById("resultadoVoz").textContent =
      "Has dicho: " + texto;
  };
}
  
  async function addProduct() {
    const name = document.getElementById("name").value.trim();
    const quantity = document.getElementById("quantity").value.trim();
    const category = document.getElementById("category").value;
    const note = document.getElementById("note").value.trim();

    if (!name || !quantity) {
      alert("Escribe el producto y la cantidad.");
      return;
    }

    const { error } = await supabaseClient
      .from("productos")
      .insert({
        nombre: name,
        cantidad: quantity,
        categoria: category,
        nota: note
      });

    if (error) {
      console.error(error);
      alert("No se ha podido añadir el producto.");
      return;
    }

    document.getElementById("name").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("category").value = "";
    document.getElementById("note").value = "";

    await loadProducts();
  }

  async function toggleProduct(id, bought) {
    const { error } = await supabaseClient
      .from("productos")
      .update({ comprado: bought })
      .eq("id", id);

    if (error) {
      console.error(error);
      return;
    }

    await loadProducts();
  }

  async function deleteProduct(id) {
    if (!confirm("¿Quieres eliminar este producto?")) return;

    const { error } = await supabaseClient
      .from("productos")
      .delete()
      .eq("id", id);

    if (error) {
      console.error(error);
      return;
    }

    await loadProducts();
  }

  async function deleteBought() {
    if (!confirm("¿Borrar todos los productos comprados?")) return;

    const { error } = await supabaseClient
      .from("productos")
      .delete()
      .eq("comprado", true);

    if (error) {
      console.error(error);
      return;
    }

    await loadProducts();
  }

  function renderProducts() {
    const pending = document.getElementById("pending");
    const bought = document.getElementById("bought");
    const search = document.getElementById("search").value.toLowerCase();

    pending.innerHTML = "";
    bought.innerHTML = "";

    const filtered = products.filter(p =>
      p.nombre.toLowerCase().includes(search)
    );

    let pendingCount = 0;

    filtered.forEach(product => {

      const element = document.createElement("div");
      element.className = "product " + (product.comprado ? "bought" : "");

      element.innerHTML = `
        <input
          type="checkbox"
          ${product.comprado ? "checked" : ""}
          onchange="toggleProduct('${product.id}', this.checked)"
        >

        <div class="info">
          <div class="name">${escapeHtml(product.nombre)}</div>
          <div class="quantity">${escapeHtml(product.cantidad)}</div>
          ${product.categoria ? `<div class="category">${escapeHtml(product.categoria)}</div>` : ""}
          ${product.nota ? `<div class="category">📝 ${escapeHtml(product.nota)}</div>` : ""}
        </div>

        <button class="delete"
          onclick="deleteProduct('${product.id}')">
          🗑️
        </button>
      `;

      if (product.comprado) {
        bought.appendChild(element);
      } else {
        pending.appendChild(element);
        pendingCount++;
      }
    });

    document.getElementById("summary").textContent =
      `${pendingCount} producto${pendingCount !== 1 ? "s" : ""} pendiente${pendingCount !== 1 ? "s" : ""}`;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  loadProducts();

  // Actualizar automáticamente cada 3 segundos
  setInterval(loadProducts, 3000);
</script>

</body>
</html>
